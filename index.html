<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="scoreboard">
            <div class="container">
                <div class="team">
                    <h3 id="home-Title">HOME</h3>
                    <div id="homeEL" class="score-box">0</div>
                    <div class="point-btns">
                        <button class="increment1-btn" onclick="home_1()">+1</button>
                        <button class="increment2-btn" onclick="home_2()">+2</button>
                        <button class="increment3-btn" onclick="home_3()">+3</button>
                    </div>
                </div>
                <div class="team">
                    <h3 id="guest-Title">GUEST</h3>
                    <div id="guestEL" class="score-box">0</div>
                    <div class="point-btns">
                        <button class="increment1-btn" onclick="guest_1()">+1</button>
                        <button class="increment2-btn" onclick="guest_2()">+2</button>
                        <button class="increment3-btn" onclick="guest_3()">+3</button>
                    </div>
                </div>
            </div>
            <button id="newgameEL" onclick="new_game()">New Game</button>
            <script src="index.js"></script>
       </div>     
    </body>
</html>
